<script>
const API="https://souqnova-api.ismailnhari666.workers.dev";
const cart=new Map();
let products=[];
let pending=null;
let openedProduct=null;
let sending=false;
let orderDone=false;
let turnstileWidget=null;
// Cloudflare Turnstile (anti-spam). Laisser vide pour le désactiver ;
// renseigner la "site key" ET le secret TURNSTILE_SECRET côté Worker pour l'activer.
const TURNSTILE_SITE_KEY="";

// Même règle que dans worker.js (le Worker recalcule de toute façon).
const CASA_RE=/casablanca|\bcasa\b|dar el beida|dar el-beida|الدار البيضاء|الدارالبيضاء/i;
const shippingFee=city=>CASA_RE.test(String(city||""))?20:30;
const round2=n=>Math.round(n*100)/100;

const $=id=>document.getElementById(id);
const money=n=>Number(n).toFixed(2).replace(/\.00$/,"")+" DH";

function imgUrl(v){
  if(Array.isArray(v)) v=v[0];
  if(v && typeof v==="object") v=v.url||v.src||v.image_url||"";
  const m=String(v||"").match(/https?:\/\/[^)\s"'<>]+/i);
  return m?m[0].replace(/[.,;]+$/,""):"";
}
function cleanProductText(value){
  if(value==null) return "";
  if(typeof value==="object"){
    if(Array.isArray(value)) return value.map(cleanProductText).filter(Boolean).join("\n");
    value=value.text||value.value||value.description||value.name||"";
  }
  let s=String(value);
  s=s.replace(/<\/(p|div|li|h[1-6]|br)>/gi,"\n")
     .replace(/<br\s*\/?\s*>/gi,"\n")
     .replace(/<[^>]*>/g," ")
     .replace(/&nbsp;/gi," ")
     .replace(/&amp;/gi,"&").replace(/&lt;/gi,"<")
     .replace(/&gt;/gi,">").replace(/&quot;/gi,'"')
     .replace(/&#39;|&apos;/gi,"'")
     .replace(/\s+\n/g,"\n").replace(/\n{3,}/g,"\n\n")
     .replace(/[ \t]{2,}/g," ").trim();
  // Avoid displaying serialized API objects or code fragments as customer-facing copy.
  if(/^\s*[\[{]/.test(s) || /<\/?[a-z][^>]*>/i.test(s)) return "";
  return s;
}

function normalizeProducts(list){
  return list.map(p => ({
    ...p,
    name: p.name || "Produit",
    price: Number(p.suggested_retail_price || p.minimum_selling_price || 0),
    min: Number(p.minimum_selling_price || 0),
    stock: Number(p.stock_quantity || 0),
    active: p.is_active !== false,
    supplier: String(p.supplier_group_id || ""),
    image: imgUrl(p.main_image || (p.images || [])[0])
  }));
}

async function load(){
  const status = $("status");
  const grid = $("products");

  status.style.display = "block";
  status.textContent = tr("loading");
  grid.innerHTML = "";

  try {
    let allProducts = [];
    let hasMore = true;
    let cursor = null;
    let pages = 0;

    while (hasMore && pages < 100) {
      const params = new URLSearchParams({limit: "50"});
      if (cursor) params.set("cursor", cursor);

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 30000);
      let response;
      try {
        response = await fetch(
          API + "/api/products?" + params.toString(),
          { signal: controller.signal }
        );
      } catch (networkError) {
        if (networkError.name === "AbortError") {
          throw new Error("Le serveur produits ne répond pas (délai dépassé).");
        }
        throw new Error("Connexion au serveur impossible : " + networkError.message);
      } finally {
        clearTimeout(timeout);
      }

      const data = await response.json();

      const pageProducts = Array.isArray(data.data)
        ? data.data
        : Array.isArray(data.data?.products)
          ? data.data.products
          : Array.isArray(data.products)
            ? data.products
            : null;

      if (!response.ok || !pageProducts) {
        throw new Error(data.error || data.message || "Format de catalogue inattendu");
      }

      allProducts.push(...pageProducts);

      // Afficher dès la première page, sans attendre tout le catalogue.
      if (pages === 0) {
        products = normalizeProducts(allProducts);
        draw();
        status.style.display = "block";
        status.textContent = tr("loadingMore");
      }

      const pagination = data.pagination || data.data?.pagination || {};
      hasMore = pagination.has_more === true;
      cursor = pagination.next_cursor || null;
      pages++;

      if (hasMore && !cursor) {
        throw new Error("Pagination: next_cursor manquant");
      }
      if (hasMore && pages >= 100) {
        throw new Error("Limite de pagination atteinte.");
      }
    }

    products = normalizeProducts(allProducts);
    refreshCategories();
    draw();

    status.style.display = "block";
    status.textContent =
      products.length + tr("loaded");

    if (location.hash.startsWith("#product=")) {
      let wanted = "";
      try { wanted = decodeURIComponent(location.hash.slice(9)); } catch {}
      const found = products.find(x => String(x.sku) === wanted);
      if (found) openProduct(found, true);
    }

  } catch (error) {
    status.style.display = "block";
    status.textContent =
      tr("loadError") + error.message;
  }
}
function productCategory(p){
  const candidates=[
    p.category_name,p.category_name_ar,p.category_name_fr,
    p.category,p.product_category,p.category_title,
    p.category?.name,p.category?.title,p.category?.name_ar,p.category?.name_fr
  ];
  for(const value of candidates){
    const cleaned=cleanProductText(value);
    if(cleaned && cleaned.length<90) return cleaned;
  }
  return "";
}

function refreshCategories(){
  // La barre de catégories a été retirée du design; aucune sélection à reconstruire.
}

function draw(){

let term=$("search").value.toLowerCase();
let list=products.filter(p=>{
const name=String(p.name||"").toLowerCase();
const sku=String(p.sku||"").toLowerCase();
return name.includes(term)||sku.includes(term);
});

list.sort((a,b)=>a.price-b.price);

$("products").innerHTML="";

if(!list.length){
$("status").style.display="block";
$("status").textContent=tr("noProducts");
return;
}

$("status").style.display="none";

list.forEach(p=>{

let c=document.createElement("article");
c.className="card";

let ph=document.createElement("div");
ph.className="photo";

if(p.image){
let im=document.createElement("img");
im.src=p.image;
im.alt=p.name;
im.loading="lazy";
im.onerror=()=>{ph.innerHTML="";let fallback=document.createElement("span");fallback.className="photo-fallback";fallback.textContent="SouqNova";ph.append(fallback);};
ph.append(im);
}else{
let fallback=document.createElement("span");
fallback.className="photo-fallback";
fallback.textContent="SouqNova";
ph.append(fallback);
}

let inf=document.createElement("div");
inf.className="info";

let n=document.createElement("div");
n.className="name";
n.textContent=p.name;

let ref=document.createElement("div");
ref.className="muted";
ref.textContent=tr("ref")+p.sku;

let pr=document.createElement("div");
pr.className="price";
pr.textContent=money(p.price);

let details=document.createElement("button");
details.className="details-btn";
details.textContent=tr("details");
details.onclick=()=>openProduct(p);

let b=document.createElement("button");
b.className="add";
b.textContent=tr("add");
b.disabled=!(p.stock>0 && p.sku && p.price>0);
if(b.disabled){b.textContent=tr("unavailable");b.style.opacity=".55";b.style.cursor="not-allowed";}
b.onclick=()=>{if(!b.disabled)add(p);};

let actions=document.createElement("div");
actions.className="product-actions";
actions.append(details,b);
inf.append(n,ref,pr,actions);
c.append(ph,inf);

$("products").append(c);

});
}

function productField(p, keys){
  for(const key of keys){
    const value=p[key];
    const cleaned=cleanProductText(value);
    if(cleaned) return cleaned;
  }
  return "";
}
function productSpecs(p){
  const labels=currentLang==="ar"
    ? {brand:"العلامة التجارية",category:"الصنف",color:"اللون",size:"المقاس",material:"المادة",weight:"الوزن",dimensions:"الأبعاد",sku:"المرجع"}
    : {brand:"Marque",category:"Catégorie",color:"Couleur",size:"Taille",material:"Matière",weight:"Poids",dimensions:"Dimensions",sku:"Référence"};
  const keys={brand:["brand","brand_name"],category:["category","category_name"],color:["color","colour"],size:["size"],material:["material"],weight:["weight"],dimensions:["dimensions","dimension"],sku:["sku"]};
  return Object.entries(keys).map(([k,aliases])=>{
    const v=productField(p,aliases);
    return v?labels[k]+": "+v:"";
  }).filter(Boolean);
}
function openProduct(p,fromUrl){
  openedProduct=p;
  const description=productField(p,["description_ar","arabic_description","description","short_description","product_description"]);
  const usage=productField(p,["usage_ar","how_to_use_ar","usage_instructions","instructions","how_to_use"]);
  $("products").hidden=true;
  $("status").hidden=true;
  $("productDetail").hidden=false;
  $("detailName").textContent=p.name;
  $("detailPrice").textContent=money(p.price);
  $("detailKicker").textContent=tr("details");
  $("descriptionHeading").textContent=tr("description");
  $("usageHeading").textContent=tr("usage");
  const descriptionText=description || tr("descriptionUnavailable");
  const descriptionEl=$("detailDescription");
  const readMoreBtn=$("readMore");
  descriptionEl.textContent=descriptionText;
  descriptionEl.classList.remove("expanded");
  readMoreBtn.hidden=true;
  readMoreBtn.textContent=tr("readMore");
  readMoreBtn.onclick=()=>{
    const expanded=descriptionEl.classList.toggle("expanded");
    readMoreBtn.textContent=tr(expanded?"readLess":"readMore");
  };
  requestAnimationFrame(()=>{
    readMoreBtn.hidden=descriptionEl.scrollHeight<=descriptionEl.clientHeight+2;
  });
  $("detailUsage").textContent=usage || tr("usageUnavailable");
  const specs=[...productSpecs(p),p.stock>0?tr("available"):tr("unavailable")].filter(Boolean);
  $("detailSpecs").textContent=specs.join(" · ");
  $("detailPhoto").innerHTML="";
  if(p.image){
    const img=document.createElement("img");
    img.src=p.image; img.alt=p.name; img.loading="lazy";
    $("detailPhoto").append(img);
  }else{
    const fallback=document.createElement("span");
    fallback.className="photo-fallback"; fallback.textContent="SouqNova";
    $("detailPhoto").append(fallback);
  }
  $("detailAdd").textContent=tr("add");
  $("detailAdd").disabled=!(p.stock>0 && p.sku && p.price>0);
  if($("detailAdd").disabled){$("detailAdd").textContent=tr("unavailable");$("detailAdd").style.opacity=".55";}
  $("detailAdd").onclick=()=>{if(!$("detailAdd").disabled)add(p);};
  document.title=p.name+" | SouqNova";
  if(!fromUrl) history.pushState({product:p.sku},"","#product="+encodeURIComponent(p.sku));
  window.scrollTo({top:0,behavior:"instant"});
  $("productDetail").scrollIntoView({block:"start",behavior:"instant"});
}
function closeProduct(){
  $("productDetail").hidden=true;
  $("products").hidden=false;
  $("status").hidden=false;
  openedProduct=null;
  document.title=tr("seoTitle");
  if(location.hash.startsWith("#product=")) history.pushState({},"",location.pathname+location.search);
}
$("backToProducts").addEventListener("click",closeProduct);
window.addEventListener("popstate",()=>{
  if(openedProduct){
    $("productDetail").hidden=true;
    $("products").hidden=false;
    $("status").hidden=false;
    openedProduct=null;
    document.title=tr("seoTitle");
  }
});
function invalidatePending(){
  if(sending) return;
  if(!pending && !orderDone) return;
  pending=null;
  orderDone=false;
  $("ok").style.display="none";
  const b=$("send");
  b.disabled=false;
  b.textContent=tr("send");
}

function add(p){
invalidatePending();
let x=cart.get(p.sku);

if(x)x.qty++;
else cart.set(p.sku,{...p,qty:1});

update();
}

function update(){

$("count").textContent=
[...cart.values()].reduce((s,p)=>s+p.qty,0);

$("cart").innerHTML="";

let total=0;

cart.forEach(p=>{

total+=p.price*p.qty;

let row=document.createElement("div");
row.className="line";

let label=document.createElement("span");
label.textContent=`${p.name} · ${money(p.price)} × ${p.qty}`;

let ctr=document.createElement("span");

let minus=document.createElement("button");
minus.textContent="−";
minus.onclick=()=>qty(p.sku,-1);

let plus=document.createElement("button");
plus.textContent="+";
plus.onclick=()=>qty(p.sku,1);

ctr.append(minus,plus);
row.append(label,ctr);

$("cart").append(row);

});

$("subtotal").textContent=tr("subtotal")+" : "+money(total);
}

function qty(s,d){
invalidatePending();
let p=cart.get(s);
p.qty+=d;

if(p.qty<1)cart.delete(s);

update();
}

function closeCart(){
$("overlay").classList.remove("open");
$("open").focus();
}

$("open").onclick=()=>{
$("overlay").classList.add("open");
update();
$("close").focus();
};

$("close").onclick=closeCart;
$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closeCart();});
document.addEventListener("keydown",e=>{
if(e.key==="Escape"&&$("overlay").classList.contains("open"))closeCart();
});
$("form").addEventListener("input",invalidatePending);

$("search").oninput=draw;

async function post(path,data){

let r=await fetch(API+path,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

let d;
try{d=await r.json();}catch{d={};}

if(!r.ok||d.success===false)
throw Error(d.error||d.message||"Erreur API");

return d;
}

function err(t){
$("err").style.display="block";
$("err").textContent=t;
$("ok").style.display="none";
}

function ok(t){
$("ok").style.display="block";
$("ok").textContent=t;
$("err").style.display="none";
}
$("form").onsubmit=async e=>{
e.preventDefault();

if(sending||orderDone) return;

let btn=$("send");

if(pending){

let token=turnstileToken();

if(TURNSTILE_SITE_KEY && !token){
err(tr("captcha"));
return;
}

sending=true;
btn.disabled=true;
btn.textContent=tr("sending");

try{

let payload={...pending};
if(token) payload.turnstile_token=token;

let d=await post("/api/orders",payload);
let x=d.results?.[0];

if(d.success!==true || !x || !["created","duplicate"].includes(x.status)){
throw Error(x?.error||x?.status||tr("unconfirmed"));
}

ok(tr("sent")+(x.order_id||"—"));

cart.clear();
pending=null;
orderDone=true;
e.target.reset();
update();

btn.textContent=tr("done");

}catch(ex){

err(tr("orderError")+ex.message);
btn.disabled=false;
btn.textContent=tr("retry");

}finally{

sending=false;
resetTurnstile();

}

return;
}

if(!cart.size){
err(tr("emptyCart"));
return;
}

let items=[...cart.values()];

let groups=[...new Set(items.map(p=>p.supplier).filter(Boolean))];

if(groups.length>1){
err(tr("multi"));
return;
}

if(items.some(p=>p.price<p.min)){
err(tr("min"));
return;
}

let f=new FormData(e.target);

let customer={
customer_name:String(f.get("customer_name")).trim(),
customer_phone:String(f.get("customer_phone")).replace(/\s/g,""),
city:String(f.get("city")).trim(),
address:String(f.get("address")).trim(),
notes:String(f.get("notes")||"").trim()
};

if(!/^(05|06|07)\d{8}$/.test(customer.customer_phone)){
err(tr("phoneError"));
return;
}

let fee=shippingFee(customer.city);

let sub=round2(items.reduce((s,p)=>s+p.price*p.qty,0));

sending=true;
btn.disabled=true;
btn.textContent=tr("quote");

try{

let q=await post("/api/quote",{
city:customer.city,
customer_shipping_fee:fee,
cod_to_collect:round2(sub+fee),
items:items.map(p=>({
sku:p.sku,
quantity:p.qty,
retail_price:p.price
}))
});

if(q.success!==true || q.is_valid!==true){
throw Error(q.error||q.message||tr("quoteInvalid"));
}

pending={
external_order_id:"SN-"+Date.now()+"-"+Math.random().toString(36).slice(2,8),
...customer,
customer_shipping_fee:fee,
items:items.map(p=>({
product_code:p.sku,
quantity:p.qty,
retail_price:p.price,
supplier_group_id:p.supplier
}))
};

ok(
tr("quoteOk")+money(round2(sub+fee))+". "+tr("notSent")
);

btn.textContent=tr("confirm");
btn.disabled=false;

}catch(ex){

pending=null;
err(tr("quoteFail")+ex.message);
btn.textContent=tr("send");
btn.disabled=false;

}finally{

sending=false;

}

};

function initTurnstile(){
  if(!TURNSTILE_SITE_KEY) return;
  const sc=document.createElement("script");
  sc.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
  sc.async=true;
  sc.onload=()=>{turnstileWidget=window.turnstile.render("#turnstile",{sitekey:TURNSTILE_SITE_KEY});};
  document.head.append(sc);
}
function turnstileToken(){
  return (TURNSTILE_SITE_KEY && turnstileWidget!==null && window.turnstile)
    ? window.turnstile.getResponse(turnstileWidget) : "";
}
function resetTurnstile(){
  if(TURNSTILE_SITE_KEY && turnstileWidget!==null && window.turnstile) window.turnstile.reset(turnstileWidget);
}

async function loadCities(){
  try{
    const r=await fetch(API+"/api/cities");
    if(!r.ok) return;
    const d=await r.json();
    const list=Array.isArray(d)?d:Array.isArray(d.data)?d.data
      :Array.isArray(d.data?.cities)?d.data.cities:Array.isArray(d.cities)?d.cities:[];
    const names=[...new Set(list
      .map(c=>typeof c==="string"?c:(c.name_fr||c.name||c.name_ar||c.city||""))
      .map(n=>String(n).trim()).filter(Boolean))];
    $("cityList").replaceChildren(...names.map(n=>{const o=document.createElement("option");o.value=n;return o;}));
  }catch{}
}

function tr(key){ return translations[currentLang]?.[key] ?? translations.fr[key] ?? key; }
function setLanguage(lang){
  currentLang = lang === "ar" ? "ar" : "fr";
  localStorage.setItem("souqnova_lang", currentLang);
  document.documentElement.lang = currentLang;
  document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";
  $("topStrip").textContent = tr("top");
  $("backLabel").textContent = tr("back");
  $("search").placeholder = tr("search");
  $("cartTitle").textContent = tr("cart");
  $("close").textContent = tr("close");
  $("nameLabel").textContent = tr("name");
  $("phoneLabel").textContent = tr("phone");
  $("cityLabel").textContent = tr("city");
  document.querySelector('input[name="city"]').placeholder = currentLang === "ar" ? "مثال: الرباط، سلا، الدار البيضاء" : "Ex. : Rabat, Salé, Casablanca";
  $("addressLabel").textContent = tr("address");
  $("notesLabel").textContent = tr("notes");
  $("footerText").textContent = tr("footer");
  $("policyLink").textContent = tr("policyLink");
  $("shipNote").textContent = tr("shipNote");
  $("stepNote").textContent = tr("stepNote");
  $("langToggle").textContent = tr("langButton");
  const sb = $("send");
  if (orderDone) sb.textContent = tr("done");
  else if (!sb.disabled) sb.textContent = pending ? tr("confirm") : tr("send");
  draw();
}
